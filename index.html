<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Returns Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEDF3; --surface:#FFFFFF; --ink:#1E1A2B; --muted:#62597A; --line:#D6D0E2;
  --brand:#510C76; --brand-ink:#FFFFFF; --brand-soft:#EFE5F6;
  --tape:#F2C230; --tape-ink:#2A2100; --good:#2F7D32; --good-soft:#E3F2E1; --bad:#B3261E; --bad-soft:#FBE4E2;
  --shadow:0 1px 0 rgba(30,26,43,.06);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17141F; --surface:#221E2D; --ink:#F1EEF7; --muted:#ABA2C2; --line:#3A3448;
  --brand:#B98BDB; --brand-ink:#1A0F24; --brand-soft:#2E2340;
  --tape:#E9B923; --tape-ink:#211A00; --good:#7BC67E; --good-soft:#1E3220; --bad:#F2918A; --bad-soft:#3A1F1E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17141F; --surface:#221E2D; --ink:#F1EEF7; --muted:#ABA2C2; --line:#3A3448;
  --brand:#B98BDB; --brand-ink:#1A0F24; --brand-soft:#2E2340;
  --tape:#E9B923; --tape-ink:#211A00; --good:#7BC67E; --good-soft:#1E3220; --bad:#F2918A; --bad-soft:#3A1F1E; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
h1{font-size:2.4rem;line-height:1;margin:0 0 .4rem;font-weight:800}
h2{font-size:1.6rem;line-height:1.05;margin:0 0 .5rem;font-weight:800}
h3{font-size:1.2rem;margin:0;font-weight:700}
p{margin:.3rem 0 .8rem}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:1.05rem;background:var(--brand);color:var(--brand-ink)}
.btn.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice b{display:block;font-size:1.05rem}
.choice span{display:block;color:var(--muted);font-size:.95rem}
section{margin:18px 0}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .wk{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5rem;line-height:1}
.bar .stat{margin-left:auto;text-align:right;font-size:.85rem;line-height:1.15}
.bar .stat b{display:block;font-size:1.2rem}
.slots{display:flex;gap:6px}
.slot{width:18px;height:18px;border-radius:4px;border:2px solid var(--brand-ink);opacity:.9}
.slot.on{background:var(--tape);border-color:var(--tape)}
/* return labels: the signature element */
.label{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:6px;margin:0 0 12px;padding:12px 14px 12px 64px;width:100%;text-align:left;display:block}
.label::before{content:"";position:absolute;left:0;top:0;bottom:0;width:50px;border-right:2px dashed var(--line)}
.label .em{position:absolute;left:0;top:50%;transform:translateY(-50%);width:50px;text-align:center;font-size:1.6rem}
.label .top{display:flex;align-items:baseline;gap:8px}
.label .val{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.4rem}
.label .cond{font-family:"Barlow",sans-serif;color:var(--muted);font-size:.93rem;margin:2px 0 6px}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-right:6px}
.tag.decay{background:var(--tape);color:var(--tape-ink)}
.tag.flat{background:var(--brand-soft);color:var(--brand)}
.tag.unk{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.label.done{border-style:dashed;opacity:.85}
.label.done .val{text-decoration:none}
.stamp{display:inline-block;margin-top:4px;font-weight:700;color:var(--good)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,16,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.opt .nm{font-weight:700}
.opt .sub{font-size:.9rem;color:var(--muted)}
.opt .net{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5rem;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.note{border-left:4px solid var(--tape);background:var(--surface);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.note.bad{border-color:var(--bad)} .note.good{border-color:var(--good)}
/* event */
.card{background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:18px}
.coin{width:120px;height:120px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;background:var(--tape);color:var(--tape-ink);font:800 1.3rem "Barlow Condensed",sans-serif;border:4px solid var(--ink)}
.coin.spin{animation:spin .9s ease-out}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(1440deg)}}
@media (prefers-reduced-motion:reduce){.coin.spin{animation:none}}
.ht{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ht .h{border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:.95rem}
.ht .h b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.2rem}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.foot .in{max-width:560px;margin:0 auto}
.big{font:800 3.4rem/1 "Barlow Condensed",sans-serif}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.linkish{background:none;border:0;color:var(--brand);text-decoration:underline;padding:0;font-weight:600}
.lb input{width:100%;font:inherit;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.proj h1{font-size:3.4rem}
.proj .card{font-size:1.4rem}
.proj .ht .h{font-size:1.2rem}

.risk{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:260px;margin:8px 0}
.dot{aspect-ratio:1;border-radius:3px;background:var(--good)}
.dot.b{background:var(--bad)}
.two{font-size:.9rem;margin-top:2px}
.two .pos,.two .neg{font-weight:700}
.opt:disabled{opacity:.5}
.why{font-size:.85rem;color:var(--muted);margin-top:2px}
.hero{background:var(--brand);color:var(--brand-ink);margin:-16px -16px 16px;padding:28px 18px 22px}
.hero h1{font-size:2.8rem}
.hero p{opacity:.95}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kv b{white-space:nowrap}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:999px;padding:2px 10px;font-size:.85rem}
.status{margin-top:10px;font-weight:600}
.unbox .out{opacity:0;animation:show .3s ease-out 1.6s forwards}
.unbox .val{opacity:0;animation:show .3s ease-out 1.6s forwards}
.unbox .pkg{display:inline-block;animation:shake 1.6s ease-in-out forwards}
.unbox .res{display:none}
.unbox.opened .pkg{display:none}.unbox.opened .res{display:inline}
.later{opacity:0;animation:show .3s ease-out 1.6s forwards}
@media (prefers-reduced-motion:reduce){.later{animation:none;opacity:1}}
.out{font-weight:600;margin-top:4px}
@keyframes shake{0%,100%{transform:rotate(0)}10%,30%,50%,70%{transform:rotate(-12deg)}20%,40%,60%,80%{transform:rotate(12deg)}90%{transform:scale(1.25)}}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.unbox .pkg{animation:none}.unbox .out,.unbox .val{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== Returns Triage: game data and rules (no DOM) =====
const CFG = {
  weeks: 6, capacity: 2, upgradeWeek: 2,
  service: { fee: 5, share: 0.20, unprocessed: 10 },
  box: { price: 1500 },
  checkCost: 20, checkCostStation: 5, authCost: 40,
  landfillFee: 20,
};
const CHANNELS = {
  new:      { label: 'Restock as new',        cost: 5,  pct: { service: 1.00, box: 0.65 } },
  used:     { label: 'Sell as open-box',      cost: 8,  pct: { service: 0.60, box: 0.45 } },
  refurb:   { label: 'Refurbish and sell',    cost: 25, pct: { service: 0.85, box: 0.60 } },
  liq:      { label: 'Sell to a liquidator, as is', cost: 2, pct: { service: 0.20, box: 0.20 } },
  donate:   { label: 'Donate',                cost: 3,  pct: { service: 0, box: 0 } },
  recycle:  { label: 'Recycle',               cost: 4,  pct: { service: 0, box: 0 } },
  landfill: { label: 'Landfill',              cost: 2,  pct: { service: 0, box: 0 } },
};
const UPGRADES = {
  worker:  { name: 'Hire an extra worker', cost: 60, desc: 'Process 3 items a week instead of 2.' },
  station: { name: 'Build a testing station', cost: 25, desc: 'Checking electronics and appliances costs $5 instead of $20. (Handbag authentication still costs $40.)' },
  bench:   { name: 'Set up a repair bench', cost: 40, desc: 'Unlocks “Refurbish and sell.”' },
  none:    { name: 'No upgrade', cost: 0, desc: 'Keep your cash.' },
};
// risk.bad = how many out of 20 similar returns were bad, per company records
const ITEMS = [
  { id:'laptop', name:'Laptop', emoji:'💻', cat:'el', week:1, value:900, decay:100, cond:'Sealed box. Customer says they changed their mind.',
    ch:['new','liq'], plural:'laptops', risk:{ bad:2, rec:'had an empty box (box swap fraud)', ifOk:'If the laptop is there', ifBad:'If the box is empty', kind:'swap', okLabel:'the laptop is inside', badLabel:'box is empty (swapped)', penalty:100, badCh:['recycle'] } },
  { id:'phone', name:'Smartphone', emoji:'📱', cat:'el', week:1, value:600, decay:80, cond:'Opened, used for two days. “Didn’t like it.”',
    ch:['used','refurb','liq','recycle'], plural:'smartphones', risk:{ bad:6, rec:'were locked to the customer’s account', ifOk:'If unlocked', ifBad:'If locked', kind:'locked', okLabel:'unlocked and ready to sell', badLabel:'locked to the customer’s account (parts only)', penalty:60, badCh:['liq','recycle'] } },
  { id:'jacket', name:'Winter jacket', emoji:'🧥', cat:'cl', week:1, value:180, decay:25, cond:'Tags on. Wrong color.', ch:['new','liq','donate'] },
  { id:'dress', name:'Party dress', emoji:'👗', cat:'cl', week:1, value:220, decay:25, cond:'Worn once to a wedding. Tags cut off.', ch:['used','liq','donate','landfill'], usedLabel:'Sell as used' },
  { id:'coffee', name:'Coffee maker', emoji:'☕', cat:'home', week:1, value:80, decay:5, cond:'Customer says it won’t turn on.',
    ch:['used','refurb','liq','recycle','landfill'], plural:'coffee makers', risk:{ bad:10, rec:'were really broken (the rest just weren’t plugged in right)', ifOk:'If it works', ifBad:'If it’s broken', kind:'broken', okLabel:'it works fine (customer error)', badLabel:'really broken', penalty:30, badCh:['refurb','liq','recycle','landfill'] } },
  { id:'case', name:'Phone case', emoji:'🔲', cat:'acc', week:1, value:12, decay:0, cond:'Unopened. Wrong phone model.', ch:['new','donate','landfill'] },
  { id:'bag', name:'Designer handbag', emoji:'👜', cat:'lux', week:2, value:1500, decay:40, cond:'Looks like new, in its dust bag.',
    ch:['new','used','liq','recycle','landfill'], plural:'designer handbags', risk:{ bad:5, rec:'were counterfeits (the customer kept the real one)', ifOk:'If genuine', ifBad:'If fake', kind:'fake', okLabel:'genuine', badLabel:'counterfeit (customer kept the real one)', penalty:500, badCh:['recycle'], auth:true } },
  { id:'shoes', name:'Running shoes', emoji:'👟', cat:'cl', week:2, value:120, decay:15, cond:'Worn on one run. Wrong size.', ch:['used','donate','landfill'], usedLabel:'Sell as used' },
  { id:'headph', name:'Headphones', emoji:'🎧', cat:'el', week:2, value:300, decay:30, cond:'One ear cup is dead.',
    ch:['refurb','liq','recycle'], plural:'headphones', risk:{ bad:6, rec:'had a dead main board and couldn’t be fixed', ifOk:'If fixable', ifBad:'If the board is dead', kind:'board', okLabel:'only the ear cup is bad (fixable)', badLabel:'main board is dead (can’t be fixed)', penalty:0, badCh:['liq','recycle'] } },
  { id:'mat', name:'Yoga mat', emoji:'🧘', cat:'home', week:2, value:40, decay:0, cond:'Used about ten times.', ch:['donate','recycle','landfill'] },
  { id:'boots', name:'Kids’ winter boots', emoji:'🥾', cat:'cl', week:2, value:70, decay:10, cond:'Tags on. Kid outgrew them already.', ch:['new','liq','donate'] },
  { id:'tablet', name:'Tablet', emoji:'📟', cat:'el', week:4, value:400, decay:50, cond:'Opened, works fine. Gift the person didn’t want.', ch:['used','refurb','liq','recycle'] },
  { id:'console', name:'Game console', emoji:'🎮', cat:'el', week:4, value:500, decay:40, cond:'Sealed box. Duplicate gift.',
    ch:['new','liq'], plural:'game consoles', risk:{ bad:2, rec:'had an empty box (box swap fraud)', ifOk:'If the console is there', ifBad:'If the box is empty', kind:'swap', okLabel:'the console is inside', badLabel:'box is empty (swapped)', penalty:100, badCh:['recycle'] } },
  { id:'blender', name:'Blender', emoji:'🥤', cat:'home', week:4, value:90, decay:5, cond:'Used once. “Too loud.”', ch:['used','liq','donate'] },
];
const EVENTS = [
  { title:'Carrier strike', heads:'Trucks run on time. Nothing happens.', tails:'Trucks are stuck. Everything still in your warehouse loses an extra week of value.' },
  { title:'A new phone model launches', heads:'The launch slips. Nothing happens.', tails:'Electronics still in your warehouse lose 30% of their value.' },
  { title:'The season ends', heads:'Cold weather hangs on. Nothing happens.', tails:'Clothing and shoes still in your warehouse lose half their value.' },
  { title:'An influencer posts about designer bags', heads:'It goes viral. The handbag, dress, and shoes still in your warehouse gain 20%.', tails:'Nobody notices. Nothing happens.' },
  { title:'Liquidators are flooded', heads:'Prices hold. Nothing happens.', tails:'Next week, liquidators pay only half their usual price.' },
  { title:'Landfill fees go up', heads:'The city postpones it. Nothing happens.', tails:'You pay an extra $20 for every item you sent to landfill.' },
];
const def = id => ITEMS.find(i => i.id === id);
function newGame(rand = Math.random) {
  const hidden = {};
  ITEMS.forEach(it => { if (it.risk) hidden[it.id] = rand() < it.risk.bad / 20 ? 'bad' : 'ok'; });
  return { team:'', model:null, upgrade:null, week:1, phase:'intro', liqHalf:false,
    items: ITEMS.map(it => ({ id:it.id, value:it.value, status: it.week === 1 ? 'waiting' : 'future', checked:false, week:null, ch:null })),
    hidden, ledger:[], checks:[], events:[], upgradeOffered:false, submitted:false };
}
const capacity = g => CFG.capacity + (g.upgrade === 'worker' ? 1 : 0);
const usedSlots = g => g.ledger.filter(r => r.week === g.week).length;
const stateOf = (g, id) => g.items.find(s => s.id === id);
function knownState(g, id) { const it = def(id), st = stateOf(g, id); if (!it.risk) return 'ok'; return st.checked ? g.hidden[id] : null; }
function checkCost(g, id) { const it = def(id); if (!it.risk) return 0; if (it.risk.auth) return CFG.authCost; return g.upgrade === 'station' ? CFG.checkCostStation : CFG.checkCost; }
function chLabel(it, c, g) {
  if (c === 'new' && g.model === 'box') return 'Sell new in box, online';
  if (c === 'used' && it.usedLabel) return it.usedLabel + (g.model === 'box' ? ', online' : '');
  if (c === 'used' && g.model === 'box') return 'Sell as open-box, online';
  if (c === 'refurb' && g.model === 'box') return 'Refurbish and sell online';
  if (c === 'recycle' && it.risk && knownState(g, it.id) === 'bad' && it.risk.kind === 'fake') return 'Destroy the counterfeit';
  if (c === 'recycle' && it.risk && knownState(g, it.id) === 'bad' && it.risk.kind === 'swap') return 'Recycle the empty box';
  return CHANNELS[c].label;
}
function channelsFor(g, id) {
  const it = def(id), k = knownState(g, id);
  let ch = (k === 'bad' ? it.risk.badCh : it.ch).slice();
  if (g.upgrade !== 'bench') ch = ch.filter(c => c !== 'refurb');
  return ch;
}
function pct(g, c) { let p = CHANNELS[c].pct[g.model]; if (c === 'liq' && g.liqHalf) p /= 2; return p; }
// outcome of choosing c for item, given its true condition ('ok'|'bad')
function outcome(g, id, c, truth) {
  const it = def(id), st = stateOf(g, id), cost = CHANNELS[c].cost;
  let recovery = Math.round(st.value * pct(g, c)), penalty = 0;
  if (truth === 'bad' && it.risk) {
    const k = it.risk.kind;
    if (k === 'fake' && ['new','used','liq'].includes(c)) { recovery = 0; penalty = it.risk.penalty; }
    else if (['swap','locked','broken'].includes(k) && ['new','used'].includes(c)) { recovery = 0; penalty = it.risk.penalty; }
    else if ((k === 'locked' || k === 'board') && c === 'refurb') recovery = 0;
    else if (k === 'swap' && c === 'refurb') recovery = 0;
  }
  const income = g.model === 'service' ? CFG.service.fee + Math.round(recovery * CFG.service.share) : recovery;
  return { recovery, income, cost, penalty, net: income - cost - penalty };
}
function doCheck(g, id) { const st = stateOf(g, id); if (st.checked) return; const c = checkCost(g, id); st.checked = true; g.checks.push({ week:g.week, id, cost:c }); }
function processItem(g, id, c) {
  const st = stateOf(g, id), truth = def(id).risk ? g.hidden[id] : 'ok';
  const o = outcome(g, id, c, truth);
  st.status = 'done'; st.week = g.week; st.ch = c;
  const row = { week:g.week, id, ch:c, truth, ...o };
  g.ledger.push(row); return row;
}
function undoItem(g, id) { const st = stateOf(g, id); if (st.week !== g.week) return; g.ledger = g.ledger.filter(r => !(r.id === id && r.week === g.week)); st.status='waiting'; st.week=null; st.ch=null; }
function closeWeek(g) { g.items.forEach(s => { if (s.status === 'waiting') s.value = Math.max(0, s.value - def(s.id).decay); }); g.liqHalf = false; g.phase = 'event'; }
function applyEvent(g, result) {
  const w = g.week, ev = EVENTS[w-1], waiting = g.items.filter(s => s.status === 'waiting');
  let note = result === 'heads' ? ev.heads : ev.tails, fee = 0;
  if (w === 1 && result === 'tails') waiting.forEach(s => s.value = Math.max(0, s.value - def(s.id).decay));
  if (w === 2 && result === 'tails') waiting.filter(s => def(s.id).cat === 'el').forEach(s => s.value = Math.round(s.value * 0.7));
  if (w === 3 && result === 'tails') waiting.filter(s => def(s.id).cat === 'cl').forEach(s => s.value = Math.round(s.value * 0.5));
  if (w === 4 && result === 'heads') waiting.filter(s => ['bag','dress','shoes'].includes(s.id)).forEach(s => s.value = Math.round(s.value * 1.2));
  if (w === 5 && result === 'tails') g.liqHalf = true;
  if (w === 6 && result === 'tails') fee = CFG.landfillFee * g.ledger.filter(r => r.ch === 'landfill').length;
  g.events.push({ week:w, result, note, fee });
  if (w < CFG.weeks) { g.week++; g.items.forEach(s => { if (s.status === 'future' && def(s.id).week === g.week) s.status = 'waiting'; }); g.phase = 'eventResult'; }
  else g.phase = 'final';
}
function totals(g) {
  const sum = (a, f) => a.reduce((x, r) => x + f(r), 0);
  const income = sum(g.ledger, r => r.income), costs = sum(g.ledger, r => r.cost), penalties = sum(g.ledger, r => r.penalty);
  const checks = sum(g.checks, r => r.cost), eventFees = sum(g.events, e => e.fee);
  const upgrade = g.upgrade ? UPGRADES[g.upgrade].cost : 0, boxPrice = g.model === 'box' ? CFG.box.price : 0;
  const left = g.items.filter(s => s.status !== 'done').length;

  ${t.unprocessed?line(`${t.left} item${t.left>1?'s':''} never handled`,money(-t.unprocessed),'neg'):''}
  ${line('<b>Profit</b>','<b>'+money(t.profit)+'</b>')}</table>
  ${G.model==='box'&&t.left?`<p class="muted">${t.left} item${t.left>1?'s':''} never handled and ended up worth nothing to you.</p>`:''}</section>
  <section><h3>Item by item</h3><div class="scroll"><table><tr><th>Item</th><th>Wk</th><th>Decision</th><th class="r">You earned</th></tr>
  ${G.items.map(s=>{const it=def(s.id),r=G.ledger.find(x=>x.id===s.id);
    return r?`<tr><td>${it.emoji} ${it.name}${s.checked?' ✓':''}</td><td>${r.week}</td><td>${chLabel(it,r.ch,G)}${r.penalty||(r.truth==='bad'&&!s.checked)?`<div class="neg" style="font-size:.85rem">${it.risk.badLabel}</div>`:''}</td><td class="r ${r.net<0?'neg':''}">${signed(r.net)}</td></tr>`
    :`<tr><td>${it.emoji} ${it.name}</td><td>–</td><td class="neg">Never handled</td><td class="r neg">${G.model==='service'?money(-CFG.service.unprocessed):'$0'}</td></tr>`;}).join('')}</table></div>
  <p class="muted">✓ = you paid to check it.</p></section>
  <button class="btn secondary" id="again">Start a new game on this phone</button></div>`;
  document.getElementById('send').onclick=submitResults;
  document.getElementById('again').onclick=()=>confirmSheet('Start over?','This erases this team’s game from this phone.','Start over',()=>{G=newGame();window.scrollTo(0,0);render();});
}
// ---------- instructor screen
let I=null;
function iload(){try{return JSON.parse(localStorage.getItem(IKEY))}catch(e){return null}}
function isave(){try{localStorage.setItem(IKEY,JSON.stringify(I))}catch(e){}}
function renderInstructor(){
  if(!I)I=iload()||{ev:0,flip:null};
  const ev=EVENTS[I.ev];
  $app.innerHTML=`<div class="wrap proj" style="max-width:980px">
  <div class="row" style="align-items:center"><h1 style="flex:3">End of week ${I.ev+1}</h1><button class="btn secondary" style="flex:1" id="back">Team view</button></div>
  <div class="card"><h2 style="font-size:2.4rem">${ev.title}</h2><div class="coin" id="coin" style="width:160px;height:160px;font-size:1.8rem">${I.flip?(I.flip==='heads'?'Heads':'Tails'):'Flip!'}</div>
  <div class="ht"><div class="h" style="${I.flip==='heads'?'border-color:var(--good);border-width:4px':''}"><b>Heads</b>${ev.heads}</div><div class="h" style="${I.flip==='tails'?'border-color:var(--bad);border-width:4px':''}"><b>Tails</b>${ev.tails}</div></div>
  <div class="row" style="margin-top:14px"><button class="btn secondary" id="vflip">No coin? Flip here</button><button class="btn secondary" id="clr">Clear</button></div></div>
  <div class="row" style="margin:14px 0"><button class="btn secondary" id="prev" ${I.ev===0?'disabled':''}>Previous week</button><button class="btn" id="nxt" ${I.ev===EVENTS.length-1?'disabled':''}>Next week</button></div>
  <section><h2>Results</h2><p>Teams tap “Submit results to the class” on their final screen. Results arrive in the Google Sheet linked to your form. Sort it by Profit to rank teams.</p></section></div>`;
  const re=()=>{isave();renderInstructor();};
  document.getElementById('back').onclick=()=>{mode='team';render();};
  document.getElementById('prev').onclick=()=>{I.ev--;I.flip=null;re();};
  document.getElementById('nxt').onclick=()=>{I.ev++;I.flip=null;re();};
  document.getElementById('clr').onclick=()=>{I.flip=null;re();};
  document.getElementById('vflip').onclick=()=>{I.flip=Math.random()<.5?'heads':'tails';re();document.getElementById('coin').classList.add('spin');};
}
G=load();if(G&&!G.items[0].hasOwnProperty('checked'))G=null;
if(location.hash==='#instructor')mode='instructor';
render();
</script></body></html>
